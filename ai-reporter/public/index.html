<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MacroTrade AI Reporter</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #0f1117;
      color: #e6edf3;
      line-height: 1.6;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid #30363d;
    }

    h1 {
      font-size: 28px;
      font-weight: 600;
    }

    .header-buttons {
      display: flex;
      gap: 10px;
    }

    button {
      padding: 10px 16px;
      border: 1px solid #30363d;
      background: #1c2128;
      color: #e6edf3;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }

    button:hover {
      background: #262c36;
      border-color: #444c56;
    }

    button:active {
      background: #1c2128;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #30363d;
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status {
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status.generating {
      background: rgba(88, 166, 255, 0.1);
      border: 1px solid rgba(88, 166, 255, 0.3);
      color: #58a6ff;
    }

    .status.ready {
      background: rgba(52, 211, 153, 0.1);
      border: 1px solid rgba(52, 211, 153, 0.3);
      color: #34d399;
    }

    .environment-badges {
      display: flex;
      gap: 12px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .badge {
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      border: 1px solid;
    }

    .badge.risk-on {
      background: rgba(52, 211, 153, 0.1);
      border-color: rgba(52, 211, 153, 0.3);
      color: #34d399;
    }

    .badge.risk-off {
      background: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.3);
      color: #f87171;
    }

    .badge.neutral {
      background: rgba(148, 163, 184, 0.1);
      border-color: rgba(148, 163, 184, 0.3);
      color: #cbd5e1;
    }

    .badge.bullish {
      background: rgba(52, 211, 153, 0.1);
      border-color: rgba(52, 211, 153, 0.3);
      color: #34d399;
    }

    .badge.bearish {
      background: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.3);
      color: #f87171;
    }

    .badge.hawkish {
      background: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.3);
      color: #f87171;
    }

    .badge.dovish {
      background: rgba(52, 211, 153, 0.1);
      border-color: rgba(52, 211, 153, 0.3);
      color: #34d399;
    }

    .badge.contracting {
      background: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.3);
      color: #f87171;
    }

    .badge.expanding {
      background: rgba(52, 211, 153, 0.1);
      border-color: rgba(52, 211, 153, 0.3);
      color: #34d399;
    }

    .section {
      background: #1c2128;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .section h2 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #30363d;
    }

    .executive-summary {
      font-size: 15px;
      line-height: 1.7;
      color: #c9d1d9;
      margin-bottom: 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th {
      text-align: left;
      padding: 12px 8px;
      border-bottom: 2px solid #30363d;
      font-weight: 600;
      color: #8b949e;
      text-transform: uppercase;
      font-size: 11px;
    }

    td {
      padding: 12px 8px;
      border-bottom: 1px solid #30363d;
    }

    tr:hover {
      background: rgba(88, 166, 255, 0.05);
    }

    .pair-name {
      font-weight: 600;
      color: #e6edf3;
    }

    .system-direction {
      font-weight: 600;
      display: inline-block;
      padding: 4px 8px;
      border-radius: 3px;
      font-size: 12px;
    }

    .direction-buy {
      background: rgba(52, 211, 153, 0.1);
      color: #34d399;
      border: 1px solid rgba(52, 211, 153, 0.3);
    }

    .direction-sell {
      background: rgba(239, 68, 68, 0.1);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .direction-watch {
      background: rgba(251, 146, 60, 0.1);
      color: #fb923c;
      border: 1px solid rgba(251, 146, 60, 0.3);
    }

    .direction-notrade {
      background: rgba(148, 163, 184, 0.1);
      color: #cbd5e1;
      border: 1px solid rgba(148, 163, 184, 0.3);
    }

    .verdict-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .verdict-confirmed {
      background: rgba(52, 211, 153, 0.2);
      color: #34d399;
    }

    .verdict-rejected {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
    }

    .verdict-modified {
      background: rgba(251, 146, 60, 0.2);
      color: #fb923c;
    }

    .verdict-watch {
      background: rgba(148, 163, 184, 0.2);
      color: #cbd5e1;
    }

    .verdict-skip {
      background: rgba(148, 163, 184, 0.2);
      color: #8b949e;
    }

    .confidence {
      text-align: center;
      font-weight: 600;
      font-size: 14px;
    }

    .confidence-pos {
      color: #34d399;
    }

    .confidence-neg {
      color: #f87171;
    }

    .confidence-zero {
      color: #8b949e;
    }

    .rationale {
      font-size: 12px;
      color: #8b949e;
      max-width: 300px;
    }

    .news-section {
      margin-top: 20px;
    }

    .news-item {
      padding: 12px 0;
      border-bottom: 1px solid #30363d;
    }

    .news-item:last-child {
      border-bottom: none;
    }

    .news-headline {
      font-weight: 500;
      color: #e6edf3;
      margin-bottom: 4px;
    }

    .news-meta {
      font-size: 12px;
      color: #8b949e;
      display: flex;
      gap: 12px;
      margin-bottom: 4px;
    }

    .news-currencies {
      font-size: 11px;
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .currency-tag {
      background: rgba(88, 166, 255, 0.1);
      color: #58a6ff;
      padding: 2px 6px;
      border-radius: 2px;
    }

    .footer {
      text-align: right;
      font-size: 12px;
      color: #8b949e;
      padding-top: 20px;
      border-top: 1px solid #30363d;
    }

    .collapsible-header {
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      margin: -12px -12px 12px -12px;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .collapsible-header:hover {
      background: rgba(88, 166, 255, 0.05);
    }

    .collapsible-content {
      display: none;
    }

    .collapsible-content.open {
      display: block;
    }

    .toggle-icon {
      display: inline-block;
      width: 16px;
      height: 16px;
      transition: transform 0.2s;
    }

    .toggle-icon.open {
      transform: rotate(180deg);
    }

    .opportunity-alert {
      background: rgba(52, 211, 153, 0.1);
      border-left: 4px solid #34d399;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 4px;
    }

    .watch-alert {
      background: rgba(251, 146, 60, 0.1);
      border-left: 4px solid #fb923c;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 4px;
    }

    .error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      padding: 16px;
      border-radius: 6px;
      margin-bottom: 20px;
    }

    .playbook-indicator {
      display: inline-block;
      font-size: 12px;
      background: rgba(88, 166, 255, 0.1);
      color: #58a6ff;
      padding: 4px 8px;
      border-radius: 3px;
      border: 1px solid rgba(88, 166, 255, 0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>📊 MacroTrade AI Reporter</h1>
        <p style="color: #8b949e; font-size: 13px; margin-top: 4px;">AI-powered macro trade analysis</p>
      </div>
      <div class="header-buttons">
        <button onclick="refreshReport()" id="refresh-btn">
          🔄 Refresh Report
        </button>
      </div>
    </header>

    <div id="status" class="status ready" style="margin-bottom: 20px;">
      <span>Loading report...</span>
    </div>

    <div id="content" style="display: none;">
      <!-- Environment badges -->
      <div class="environment-badges" id="environment-badges"></div>

      <!-- Executive summary -->
      <div class="section">
        <h2>Executive Summary</h2>
        <div class="executive-summary" id="summary"></div>
      </div>

      <!-- Opportunities -->
      <div id="opportunities-container"></div>

      <!-- Pairs table -->
      <div class="section">
        <h2>Pair Analysis</h2>
        <table id="pairs-table">
          <thead>
            <tr>
              <th>Pair</th>
              <th>System</th>
              <th>AI Verdict</th>
              <th>Confidence</th>
              <th>News Impact</th>
              <th>Rationale</th>
            </tr>
          </thead>
          <tbody id="pairs-tbody">
          </tbody>
        </table>
      </div>

      <!-- News section -->
      <div class="section">
        <div class="collapsible-header" onclick="toggleNews()">
          <span class="toggle-icon" id="news-toggle">▼</span>
          <h2 style="margin: 0;">News Headlines <span class="playbook-indicator" id="playbook-count" style="margin-left: 12px;"></span></h2>
        </div>
        <div class="collapsible-content open" id="news-content">
          <div id="news-list"></div>
        </div>
      </div>

      <!-- Footer -->
      <div class="footer" id="footer"></div>
    </div>

    <div id="error-container"></div>
  </div>

  <script>
    let currentReport = null;

    async function loadReport() {
      try {
        updateStatus('Generating report...', 'generating');
        const response = await fetch('/api/report');
        if (!response.ok) throw new Error(`API error: ${response.status}`);
        currentReport = await response.json();
        renderReport();
        updateStatus('Report ready', 'ready');
      } catch (error) {
        console.error('Error loading report:', error);
        showError(`Failed to load report: ${error.message}`);
        updateStatus('Error loading report', 'error');
      }
    }

    function renderReport() {
      if (!currentReport) return;

      // Environment badges
      const env = currentReport.environment;
      const badgesHTML = `
        <div class="badge risk-${env.riskEnvironment}">Risk: ${env.riskEnvironment}</div>
        <div class="badge ${env.usdBias}">USD: ${env.usdBias}</div>
        <div class="badge ${env.liquidityRegime}">Liquidity: ${env.liquidityRegime}</div>
        <div class="badge ${env.centralBankBias}">Fed: ${env.centralBankBias}</div>
        ${env.dangerZoneActive ? '<div class="badge" style="background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.3); color: #f87171;">⚠️ DANGER ZONE</div>' : ''}
      `;
      document.getElementById('environment-badges').innerHTML = badgesHTML;

      // Executive summary
      document.getElementById('summary').textContent = currentReport.executiveSummary;

      // Opportunities
      let oppHTML = '';
      if (currentReport.topOpportunity) {
        oppHTML += `<div class="section opportunity-alert">
          <strong>🎯 Top Opportunity:</strong> ${currentReport.topOpportunity.pair} ${currentReport.topOpportunity.systemDirection} (Grade ${currentReport.topOpportunity.systemGrade})
          <br><small>${currentReport.topOpportunity.aiRationale}</small>
        </div>`;
      }
      if (currentReport.topWatch) {
        oppHTML += `<div class="section watch-alert">
          <strong>👁️ Top Watch:</strong> ${currentReport.topWatch.pair} (Grade ${currentReport.topWatch.systemGrade})
          <br><small>${currentReport.topWatch.aiRationale}</small>
        </div>`;
      }
      document.getElementById('opportunities-container').innerHTML = oppHTML;

      // Pairs table
      const tbody = document.getElementById('pairs-tbody');
      tbody.innerHTML = currentReport.pairs.map(p => {
        const dirClass = p.systemDirection.toLowerCase().replace(' ', '-');
        const verdictClass = p.aiVerdict.toLowerCase();
        const confClass = p.aiConfidenceAdjustment > 0 ? 'pos' : p.aiConfidenceAdjustment < 0 ? 'neg' : 'zero';
        const confSign = p.aiConfidenceAdjustment > 0 ? '+' : '';
        return `
          <tr>
            <td class="pair-name">${p.pair}</td>
            <td>
              <div class="system-direction direction-${dirClass}">
                ${p.systemDirection} <span style="opacity: 0.7;">${p.systemScore}</span>
              </div>
              <div style="font-size: 11px; color: #8b949e; margin-top: 4px;">${p.systemGrade}</div>
            </td>
            <td>
              <div class="verdict-badge verdict-${verdictClass}">
                ${p.aiVerdict}
              </div>
            </td>
            <td class="confidence confidence-${confClass}">
              ${confSign}${p.aiConfidenceAdjustment}
            </td>
            <td style="font-size: 12px; color: #8b949e; max-width: 150px;">
              ${p.newsRelevance || '—'}
            </td>
            <td class="rationale">${p.aiRationale}</td>
          </tr>
        `;
      }).join('');

      // News
      const newsList = document.getElementById('news-list');
      if (currentReport.newsHeadlines.length > 0) {
        newsList.innerHTML = currentReport.newsHeadlines.map(news => `
          <div class="news-item">
            <div class="news-headline">${news.headline}</div>
            <div class="news-meta">
              <span>${news.source}</span>
              <span>${new Date(news.publishedAt).toLocaleString()}</span>
              ${news.url ? `<a href="${news.url}" target="_blank" style="color: #58a6ff; text-decoration: none;">→</a>` : ''}
            </div>
            ${news.relevantCurrencies.length > 0 ? `
              <div class="news-currencies">
                ${news.relevantCurrencies.map(c => `<span class="currency-tag">${c}</span>`).join('')}
              </div>
            ` : ''}
          </div>
        `).join('');
      } else {
        newsList.innerHTML = '<p style="color: #8b949e;">No recent news found.</p>';
      }

      // Playbook indicator
      document.getElementById('playbook-count').textContent =
        currentReport.playbookFilesLoaded.length > 0
          ? `${currentReport.playbookFilesLoaded.length} rule${currentReport.playbookFilesLoaded.length !== 1 ? 's' : ''} loaded`
          : 'No rules loaded';

      // Footer
      document.getElementById('footer').innerHTML = `
        Generated: ${new Date(currentReport.generatedAt).toLocaleString()}
        | Model: ${currentReport.modelUsed}
        | Tokens: ${currentReport.inputTokens} in / ${currentReport.outputTokens} out
        | Report ID: ${currentReport.reportId.substring(0, 8)}...
      `;

      // Show content
      document.getElementById('content').style.display = 'block';
      document.getElementById('error-container').innerHTML = '';
    }

    function updateStatus(text, state) {
      const status = document.getElementById('status');
      status.className = `status ${state}`;
      status.innerHTML = state === 'generating'
        ? `<span class="spinner"></span><span>${text}</span>`
        : `<span>✓</span><span>${text}</span>`;
    }

    function showError(message) {
      document.getElementById('error-container').innerHTML = `
        <div class="error">
          <strong>Error:</strong> ${message}
        </div>
      `;
    }

    function refreshReport() {
      const btn = document.getElementById('refresh-btn');
      btn.disabled = true;
      btn.style.opacity = '0.5';
      fetch('/api/report?refresh=1')
        .then(r => r.json())
        .then(report => {
          currentReport = report;
          renderReport();
          updateStatus('Report refreshed', 'ready');
          btn.disabled = false;
          btn.style.opacity = '1';
        })
        .catch(err => {
          showError(err.message);
          btn.disabled = false;
          btn.style.opacity = '1';
        });
    }

    function toggleNews() {
      const content = document.getElementById('news-content');
      const toggle = document.getElementById('news-toggle');
      content.classList.toggle('open');
      toggle.classList.toggle('open');
    }

    // Load report on page load
    loadReport();
  </script>
</body>
</html>
